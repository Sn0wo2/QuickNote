version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - ineffassign
    - staticcheck
    - unused
    - nilnesserr
    - sqlclosecheck
    - errchkjson
    - musttag
    - goconst
    - gocritic
    - prealloc
    - thelper
    - paralleltest
    - durationcheck
    - gosmopolitan
    - whitespace
    - tagalign
    - dupl
    - dogsled
    - nolintlint
    - maintidx
    - wsl_v5
    - decorder
    - asciicheck
    - bidichk
    - forbidigo
    - testifylint
    - zerologlint
    - asasalint
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - dupword
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - forcetypeassert
    - funcorder
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecksumtype
    - gosec
    - gomoddirectives
    - goprintffuncname
    - importas
    - inamedparam
    - intrange
    - loggercheck
    - makezero
    - mirror
    - nakedret
    - nilerr
    - nilnil
    - nlreturn
    - nosprintfhostport
    - perfsprint
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - tagliatelle
    - testableexamples
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - exhaustive
    - goheader
    - grouper
    - iface
    - interfacebloat
    - misspell
    - tparallel

  settings:
    revive:
      enable-default-rules: false
      rules:
        - name: var-declaration

run:
  tests: true
  concurrency: 4
  timeout: 5m
  issues-exit-code: 1
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  uniq-by-line: true

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - gofmt


